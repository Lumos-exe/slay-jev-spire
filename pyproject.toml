[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slay-jev-spire"
version = "0.1.0"
description = "Offline and live single-decision experiment using CommunicationMod and Jev"
requires-python = ">=3.12"
dependencies = ["typesafe-sdk==0.7.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["slay_jev_spire*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
